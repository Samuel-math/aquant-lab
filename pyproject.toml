[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aquant"
version = "0.1.0"
description = "Auditable daily A-share research and manual trading signals"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
aquant = "aquant.cli:main"

[tool.setuptools.packages.find]
include = ["aquant*"]
