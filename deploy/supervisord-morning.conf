[unix_http_server]
file=/root/autodl-tmp/aquant/research-supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/aquant/research-supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/root/autodl-tmp/aquant/research-supervisor.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/aquant/research-supervisor.sock

[program:aquant-research]
command=/root/aquant/.venv/bin/python -m aquant.research_worker --data-root /root/autodl-tmp/aquant/trials/pool188-morning-v1-20260930/real --out-root /root/autodl-tmp/aquant/trials/pool188-morning-v1-20260930/rolling-real --sample-size 188 --pool configs/pool188-v2-20260928.json --config configs/paper-pool188-morning-v1.json --timeout 7200 --workers 24
directory=/root/aquant-morning
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=AQUANT_MAIL_CONFIG="/root/.config/aquant/mail-disabled.json",PYTHONUNBUFFERED="1",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1"
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/aquant/research-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
