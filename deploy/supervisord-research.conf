[unix_http_server]
file=/root/autodl-tmp/aquant/research-supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/aquant/research-supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/root/autodl-tmp/aquant/research-supervisor.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/aquant/research-supervisor.sock

[program:aquant-research]
command=/root/aquant/.venv/bin/python -m aquant.research_worker --data-root /root/autodl-tmp/aquant/real --out-root /root/autodl-tmp/aquant/rolling-real --sample-size 24
directory=/root/aquant
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="2"
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/aquant/research-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
